<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMAR SAMIR | The Legend 2012</title>
    <!-- CSS Libraries -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --accent: #00d2ff;
            --secondary: #3a7bd5;
            --gold: #ffd700;
            --dark: #0a0a0a;
        }

        body {
            margin: 0; background-color: var(--dark); color: white;
            font-family: 'Cairo', sans-serif; overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
            text-align: center; position: relative;
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 7rem); margin: 0;
            background: linear-gradient(45deg, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            z-index: 2;
        }

        .birth-year {
            font-size: 1.5rem; color: var(--gold); letter-spacing: 10px;
            margin-top: 10px; font-weight: bold;
        }

        /* Floating Photos Section */
        .floating-gallery {
            padding: 100px 20px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px; max-width: 1400px; margin: 0 auto;
        }

        .img-box {
            position: relative; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: #111; height: 450px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .img-box:hover {
            transform: scale(1.05) rotate(2deg);
            border-color: var(--accent);
            z-index: 10;
        }

        .img-box img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(30%); transition: 0.5s;
        }

        .img-box:hover img { filter: grayscale(0%); }

        .img-label {
            position: absolute; bottom: 0; width: 100%;
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-weight: bold; font-size: 1.1rem; text-align: center;
        }

        /* Message Sections */
        .message-row {
            min-height: 40vh; display: flex; justify-content: center;
            align-items: center; text-align: center; padding: 50px;
            background: rgba(255,255,255,0.02); margin: 20px 0;
        }

        .message-row h2 {
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: var(--accent); max-width: 800px;
        }

        /* Final Celebration Button */
        .final-cta {
            padding: 100px 20px; text-align: center;
        }

        .btn-party {
            background: linear-gradient(45deg, var(--accent), var(--secondary));
            border: none; padding: 25px 60px; color: white;
            font-size: 1.8rem; border-radius: 100px; cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            transition: 0.3s;
        }

        .btn-party:hover { transform: scale(1.1); box-shadow: 0 0 50px var(--accent); }

        /* Scroll Progress Bar */
        .progress-bar {
            position: fixed; top: 0; left: 0; height: 5px;
            background: var(--accent); width: 0%; z-index: 1000;
        }
    </style>
</head>
<body>

<div class="progress-bar" id="bar"></div>

<section class="hero">
    <div id="confetti-canvas"></div>
    <p data-aos="fade-down">The Grand Celebration of</p>
    <h1 id="main-name">عمر سمير عمر</h1>
    <div class="birth-year">EST. 2012</div>
    <p style="margin-top: 20px; color: #888;">سكرول عشان تشوف الحكاية من أولها.. ✨</p>
</section>

<div class="message-row" data-aos="zoom-in">
    <h2>"كل سنة وأنت طيب يا أغلى الناس.. سنة جديدة مليانة نجاح وفرحة يا عمر" ❤️</h2>
</div>

<div class="floating-gallery" id="gallery">
    <!-- الصور هيتم إنتاجها هنا بالأسماء اللي طلبتها -->
</div>

<div class="message-row" data-aos="fade-right">
    <h2>"يا رب تحقق كل اللي بتتمناه وتفضل دايماً أنجح واحد في الدنيا" 🚀</h2>
</div>

<div class="final-cta">
    <h2 style="margin-bottom: 40px;">وصلنا لـ 2026 وأنت لسه الأسطورة! 👑</h2>
    <button class="btn-party" onclick="boom()">اضغط للاحتفال النهائي! 🎊</button>
</div>

<footer style="padding: 50px; text-align: center; opacity: 0.5;">
    <p>تم البرمجة بكل حب بواسطة كريم 💻</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1000, once: false });

    // أسماء الصور كما هي بالضبط بالترتيب المطلوب
    const images = [
        "1.png", "10.png", "11.png", "12.png", "2.png", "3.png", 
        "4.png", "5.png", "6.png", "7.png", "8.png", "9.png",
        "WhatsApp Image 2026-04-30 at 10.47.02 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 10.47.03 PM (1).jpeg",
        "WhatsApp Image 2026-04-30 at 10.47.03 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 2.45.52 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 7.03.39 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 7.14.48 PM.jpeg"
    ];

    const gallery = document.getElementById('gallery');

    images.forEach((imgName, index) => {
        const box = document.createElement('div');
        box.className = 'img-box';
        // إضافة أنيميشن عشوائي (يطلع من اليمين أو الشمال أو تحت)
        const anims = ['fade-up', 'fade-right', 'fade-left', 'zoom-in'];
        box.setAttribute('data-aos', anims[Math.floor(Math.random() * anims.length)]);
        
        box.innerHTML = `
            <img src="${imgName}" alt="Omar Memory">
            <div class="img-label">أحلى الذكريات ❤️</div>
        `;
        gallery.appendChild(box);
    });

    // GSAP Scroll Progress
    window.onscroll = () => {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        let scrolled = (winScroll / height) * 100;
        document.getElementById("bar").style.width = scrolled + "%";
    };

    // Celebration Functions
    function boom() {
        const duration = 5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        const interval = setInterval(function() {
            const timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            const particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // أول ما يفتح الموقع
    window.onload = () => {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        gsap.from("#main-name", { duration: 2, y: -100, opacity: 0, ease: "bounce" });
    };
</script>
</body>
</html>
