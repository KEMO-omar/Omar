<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMAR 2026 | THE 4 DIMENSIONS</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00d2ff; --secondary: #92fe9d; --accent: #ff007a; --dark: #080808;
        }

        body {
            margin: 0; background: var(--dark); color: white;
            font-family: 'Cairo', sans-serif; overflow-x: hidden;
        }

        /* Navigation Tabs */
        .design-switcher {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            padding: 10px; border-radius: 50px; display: flex; gap: 10px;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tab-btn {
            background: transparent; border: none; color: #ccc; padding: 10px 20px;
            border-radius: 30px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }

        .tab-btn.active { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }

        /* General Containers */
        .view-section { display: none; padding: 100px 20px; min-height: 100vh; }
        .view-section.active { display: block; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; transition: 0.5s; }

        /* 1. Bento Box Design */
        .bento-grid {
            display: grid; max-width: 1200px; margin: 0 auto;
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 250px); gap: 15px;
        }
        .bento-item:nth-child(1) { grid-area: 1 / 1 / 3 / 3; }
        .bento-item:nth-child(2) { grid-area: 1 / 3 / 2 / 5; }
        .bento-item { background: #111; border: 1px solid #222; border-radius: 20px; overflow: hidden; }
        .bento-item:hover img { transform: scale(1.1); }

        /* 2. Story Timeline Design */
        .timeline { max-width: 800px; margin: 0 auto; position: relative; }
        .timeline::before { content: ''; position: absolute; left: 50%; width: 2px; height: 100%; background: var(--primary); }
        .timeline-item { width: 45%; margin-bottom: 50px; position: relative; }
        .timeline-item:nth-child(even) { margin-left: auto; text-align: left; }
        .timeline-item:nth-child(odd) { text-align: right; }

        /* 3. Masonry Floating Design */
        .masonry { column-count: 3; column-gap: 20px; max-width: 1200px; margin: 0 auto; }
        .masonry-item { break-inside: avoid; margin-bottom: 20px; transition: 0.3s; }
        .masonry-item:hover { transform: translateY(-10px); }

        /* 4. Mosaic Interactive Design (No Gaps) */
        .mosaic-grid {
            display: grid; grid-template-columns: repeat(6, 1fr);
            max-width: 1000px; margin: 0 auto; gap: 5px;
        }
        .mosaic-item { aspect-ratio: 1; cursor: pointer; filter: grayscale(100%); }
        .mosaic-item:hover { filter: grayscale(0%); transform: z-index(10) scale(1.2); border-radius: 10px; }

        /* Header */
        header { text-align: center; padding: 50px 0; }
        .title-glow { font-size: 4rem; background: linear-gradient(to right, #00d2ff, #92fe9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <header>
        <h1 class="title-glow">عمر سمير 2012</h1>
        <p>اختر أسلوب العرض المفضل لديك 👇</p>
    </header>

    <!-- Switcher Tabs -->
    <div class="design-switcher">
        <button class="tab-btn active" onclick="switchView('bento', this)">Bento Box</button>
        <button class="tab-btn" onclick="switchView('timeline', this)">Timeline</button>
        <button class="tab-btn" onclick="switchView('masonry', this)">Masonry</button>
        <button class="tab-btn" onclick="switchView('mosaic', this)">Mosaic</button>
    </div>

    <!-- 1. Bento Section -->
    <section id="bento" class="view-section active">
        <div class="bento-grid" id="bentoContainer"></div>
    </section>

    <!-- 2. Timeline Section -->
    <section id="timeline" class="view-section">
        <div class="timeline" id="timelineContainer"></div>
    </section>

    <!-- 3. Masonry Section -->
    <section id="masonry" class="view-section">
        <div class="masonry" id="masonryContainer"></div>
    </section>

    <!-- 4. Mosaic Section -->
    <section id="mosaic" class="view-section">
        <div class="mosaic-grid" id="mosaicContainer"></div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        
        const images = [
            "1.png", "2.png", "3.png", "4.png", "5.png", "6.png", 
            "7.png", "8.png", "9.png", "10.png", "11.png", "12.png",
            "WhatsApp Image 2026-04-30 at 10.47.02 PM.jpeg",
            "WhatsApp Image 2026-04-30 at 10.47.03 PM (1).jpeg",
            "WhatsApp Image 2026-04-30 at 10.47.03 PM.jpeg",
            "WhatsApp Image 2026-04-30 at 2.45.52 PM.jpeg",
            "WhatsApp Image 2026-04-30 at 7.03.39 PM.jpeg",
            "WhatsApp Image 2026-04-30 at 7.14.48 PM.jpeg"
        ];

        // Generator Functions
        function initGallery() {
            const bento = document.getElementById('bentoContainer');
            const timeline = document.getElementById('timelineContainer');
            const masonry = document.getElementById('masonryContainer');
            const mosaic = document.getElementById('mosaicContainer');

            images.forEach((img, i) => {
                // Bento
                bento.innerHTML += `<div class="bento-item" data-aos="zoom-in"><img src="${img}"></div>`;
                // Timeline
                timeline.innerHTML += `<div class="timeline-item" data-aos="fade-up"><h3>ذكريات ${i+2012}</h3><img src="${img}"></div>`;
                // Masonry
                masonry.innerHTML += `<div class="masonry-item"><img src="${img}"></div>`;
                // Mosaic
                mosaic.innerHTML += `<div class="mosaic-item" onclick="boom()"><img src="${img}"></div>`;
            });
        }

        function switchView(viewId, btn) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function boom() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        initGallery();
    </script>
</body>
</html>
