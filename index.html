<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta property="og:type" content="website">
<meta property="og:url" content="https://kemo-omar.github.io/Omar/">

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://kemo-omar.github.io/Omar/">
<meta property="twitter:title" content="OMAR SAMIR | The 2012 Legend 👑">
<meta property="twitter:description" content="رحلة أسطورية وصور وذكريات لأجدع عمر في الدنيا.. كل سنة وأنت طيب يا أخويا!">
<meta property="twitter:image" content="WhatsApp Image 2026-04-30 at 10.47.03 PM (1).jpeg">

<link rel="icon" href="WhatsApp Image 2026-04-30 at 10.47.03 PM (1).jpeg" type="image/x-icon">
    
    
    <!-- Libraries -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --gold: #ffd700;
            --dark: #050505;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; background-color: var(--dark); color: white;
            font-family: 'Cairo', sans-serif; overflow-x: hidden;
        }

        /* الخلفية المتحركة */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #110022 0%, #050505 100%);
            z-index: -2;
        }

        /* شريط الكلام المتحرك */
        .marquee {
            position: fixed; top: 20%; width: 100%; overflow: hidden;
            white-space: nowrap; font-size: 10vw; font-weight: 900;
            color: rgba(255, 255, 255, 0.03); z-index: -1; pointer-events: none;
        }

        /* Hero */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .hero h1 {
            font-size: clamp(3.5rem, 12vw, 8rem); font-weight: 900; margin: 0;
            text-shadow: 0 0 20px var(--primary);
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Gallery Grid */
        .gallery-container {
            padding: 20px; max-width: 1400px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; perspective: 1000px;
        }

        /* كارت الصورة السحري */
        .img-card {
            position: relative; height: 450px; border-radius: 25px;
            cursor: pointer; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #111; border: 1px solid rgba(255,255,255,0.1);
        }

        .img-card img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 25px; pointer-events: none;
        }

        .img-card::before {
            content: "إضغط هنا! ✨"; position: absolute; top: 10px; right: 10px;
            background: rgba(0, 242, 255, 0.7); padding: 5px 15px;
            border-radius: 50px; font-size: 0.8rem; z-index: 5;
        }

        .img-card .card-info {
            position: absolute; bottom: 0; width: 100%; padding: 30px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            border-radius: 0 0 25px 25px; text-align: center;
        }

        /* Messages */
        .glow-text {
            text-align: center; padding: 100px 20px;
            font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 900;
            color: #fff; text-shadow: 0 0 15px var(--secondary);
        }

        .final-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; padding: 25px 50px; color: white;
            font-size: 1.5rem; font-weight: bold; border-radius: 50px;
            cursor: pointer; transition: 0.4s; box-shadow: 0 0 30px var(--secondary);
        }

        .final-btn:hover { transform: scale(1.1) rotate(2deg); }

        /* Animation Classes */
        .spinning { transform: rotateY(360deg) scale(0.9); }

    </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="marquee" id="marquee">OMAR SAMIR OMAR • THE LEGEND • 2012 • OMAR SAMIR OMAR • THE LEGEND • 2012</div>

<section class="hero">
    <p data-aos="fade-down" style="letter-spacing: 5px;">THE ONE AND ONLY</p>
    <h1 id="hero-title">عمر سمير</h1>
    <div style="font-size: 2rem; color: var(--gold); font-weight: 900; margin-top: 10px;">2012</div>
    <p style="margin-top: 30px; opacity: 0.6;">إسحب لتحت وإجهز للمفاجأة.. 👇</p>
</section>

<div class="glow-text" data-aos="zoom-in">
    كل سنة وأنت "الجدع" اللي دايماً منور حياتنا 💙
</div>

<div class="gallery-container" id="mainGallery">
    <!-- سيتم ملئ الصور بالـ JS -->
</div>

<div class="glow-text" data-aos="fade-up">
    أحلامك بتستناك يا بطل.. ٢٠٢٦ هي سنتك! 🚀
</div>

<div style="text-align: center; padding-bottom: 100px;">
    <button class="final-btn" onclick="megaCelebration()">إضغط هنا للاحتفال الأخير! 🎉</button>
</div>

<footer style="text-align: center; padding: 40px; opacity: 0.3; border-top: 1px solid #222;">
    تم البرمجة بواسطة كريم - ٢٠٢٦ ©
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1000 });

    const images = [
        "1.png", "10.png", "11.png", "12.png", "2.png", "3.png", 
        "4.png", "5.png", "6.png", "7.png", "8.png", "9.png",
        "WhatsApp Image 2026-04-30 at 10.47.02 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 10.47.03 PM (1).jpeg",
        "WhatsApp Image 2026-04-30 at 10.47.03 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 2.45.52 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 7.03.39 PM.jpeg",
        "WhatsApp Image 2026-04-30 at 7.14.48 PM.jpeg"
    ];

    const messages = ["أحلى ذكريات ❤️", "الأسطورة", "الجدع", "الغالي", "البطل", "سندنا 👑"];

    const gallery = document.getElementById('mainGallery');

    images.forEach((img, i) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.setAttribute('data-aos', i % 2 === 0 ? 'fade-right' : 'fade-left');
        
        card.innerHTML = `
            <img src="${img}" alt="Omar">
            <div class="card-info">
                <h3>${messages[i % messages.length]}</h3>
            </div>
        `;

        // تأثير الضغط (Spin)
        card.onclick = (e) => {
            card.classList.toggle('spinning');
            
            // صوت انفجار خفيف (Confetti) عند الصورة بالظبط
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { 
                    x: e.clientX / window.innerWidth, 
                    y: e.clientY / window.innerHeight 
                },
                colors: ['#00f2ff', '#7000ff']
            });

            setTimeout(() => card.classList.remove('spinning'), 1000);
        };

        gallery.appendChild(card);
    });

    // GSAP Marquee Animation
    gsap.to("#marquee", {
        xPercent: -50,
        repeat: -1,
        duration: 20,
        ease: "none"
    });

    // Hero Animation
    gsap.from("#hero-title", {
        duration: 1.5,
        scale: 0.5,
        opacity: 0,
        ease: "elastic.out(1, 0.3)"
    });

    function megaCelebration() {
        var end = Date.now() + (4 * 1000);
        var colors = ['#00f2ff', '#7000ff', '#ffd700'];

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: colors
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: colors
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // أول ما يفتح الصفحة
    window.onload = () => {
        megaCelebration();
    };
</script>
</body>
</html>
